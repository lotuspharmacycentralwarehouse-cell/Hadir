<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إدارة الموظفين والحضور</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #f4f6f8; margin: 0; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2, h3 { color: #333; margin-top: 0; }
    label { font-size: 14px; color: #555; display: block; margin-top: 10px; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 15px; }
    button:hover { background: #0056b3; }
    .btn-success { background: #28a745; }
    .btn-success:hover { background: #218838; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #bd2130; }
    .btn-secondary { background: #6c757d; }
    .hidden { display: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { padding: 12px; text-align: right; border-bottom: 1px solid #dee2e6; }
    th { background: #e9ecef; color: #495057; }
    tr:hover { background: #f8f9fa; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    /* صندوق كلمة المرور المنشأة */
    .credentials-box {
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }
    .cred-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px dashed #28a745;
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header-bar">
    <h2>👑 لوحة تحكم المدير (Admin)</h2>
    <button onclick="logout()" class="btn-secondary" style="width: auto; padding: 8px 16px; margin: 0;">تسجيل الخروج</button>
  </div>

  <!-- 1. قسم إضافة / تعديل موظف -->
  <div class="card">
    <h3>👤 إنشاء حساب موظف جديد (مجموعة employees)</h3>
    <form id="employeeForm">
      <div class="grid-2">
        <div>
          <label for="empCode">كود الموظف (الكود الثابت):</label>
          <input type="text" id="empCode" placeholder="مثال: EMP-101" required>
        </div>
        <div>
          <label for="empName">اسم الموظف:</label>
          <input type="text" id="empName" placeholder="مثال: أحمد محمود" required>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label for="empJob">الوظيفة / المسمى الوظيفي:</label>
          <input type="text" id="empJob" placeholder="مثال: محاسب أول" required>
        </div>
        <div>
          <label for="empEmail">البريد الإلكتروني (المستخدم للدخول):</label>
          <input type="email" id="empEmail" placeholder="example@ess.system" required>
        </div>
      </div>

      <button type="button" onclick="createEmployeeAccount()" class="btn-success">إنشاء وحفظ الموظف 💾</button>
    </form>

    <!-- صندوق نتيجة إنشاء الحساب وكلمة المرور -->
    <div id="credentialsResult" class="credentials-box hidden">
      <strong>✅ تم إنشاء حساب الموظف بنجاح!</strong>
      <div class="cred-row">
        <span>البريد الإلكتروني: <strong id="createdEmail"></strong></span>
      </div>
      <div class="cred-row">
        <span>كلمة المرور المؤقتة: <strong id="createdPassword" style="font-size: 16px; color: #d9534f;"></strong></span>
        <button onclick="copyPassword()" class="btn-secondary" style="width: auto; padding: 4px 10px; margin: 0; font-size: 12px;">📋 نسخ كلمة المرور</button>
      </div>
    </div>
  </div>

  <!-- 2. قسم تصدير التقارير الشهرية -->
  <div class="card">
    <h3>📊 تصدير تقارير الحضور والإكسل</h3>
    <div class="grid-2">
      <div>
        <label for="filterEmployee">اختر الموظف:</label>
        <select id="filterEmployee">
          <option value="ALL">جميع الموظفين</option>
        </select>
      </div>
      <div>
        <label for="filterYear">السنة:</label>
        <select id="filterYear"></select>
      </div>
    </div>
    
    <div class="grid-2">
      <div>
        <label for="filterMonth">الشهر:</label>
        <select id="filterMonth"></select>
      </div>
      <div style="display: flex; align-items: flex-end;">
        <button onclick="exportReport()" class="btn-success">تنزيل التقرير (CSV / Excel) 📥</button>
      </div>
    </div>
  </div>

  <!-- 3. قسم عرض سجلات الحضور الشاملة -->
  <div class="card">
    <h3>📋 سجلات الحضور والانصراف المسجلة</h3>
    <table>
      <thead>
        <tr>
          <th>كود الموظف</th>
          <th>اسم الموظف</th>
          <th>الوظيفة</th>
          <th>التاريخ</th>
          <th>الحضور</th>
          <th>الانصراف</th>
        </tr>
      </thead>
      <tbody id="attendanceTableBody">
        <tr><td colspan="6" style="text-align:center;">جاري تحميل البيانات...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- استدعاء خدمات Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, setDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyABP_eeOuqYlpSd848PlpKvx71oFLsxREQ",
    authDomain: "hadir-c203e.firebaseapp.com",
    projectId: "hadir-c203e",
    storageBucket: "hadir-c203e.firebasestorage.app",
    messagingSenderId: "510890207479",
    appId: "1:510890207479:web:7f710f815631b4c8f80bf2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const ALLOWED_ADMIN_EMAIL = "admin@ess.system";
  let employeesMap = {}; 
  let allAttendanceLogs = [];

  const monthNames = [
    "يناير (1)", "فبراير (2)", "مارس (3)", "أبريل (4)", 
    "مايو (5)", "يونيو (6)", "يوليو (7)", "أغسطس (8)", 
    "سبتمبر (9)", "أكتوبر (10)", "نوفمبر (11)", "ديسمبر (12)"
  ];

  onAuthStateChanged(auth, async (user) => {
    if (user && user.email === ALLOWED_ADMIN_EMAIL) {
      await loadEmployees();
      await loadAllAttendance();
      setupDateSelectors();
    } else {
      window.location.href = "index.html";
    }
  });

  // توليد كلمة مرور تبدأ بـ ess# يتبعها 6 أرقام عشوائية
  function generateRandomPassword() {
    const randomNumbers = Math.floor(100000 + Math.random() * 900000); // 6 أرقام
    return `ess#${randomNumbers}`;
  }

  // 1. إنشاء حساب الموظف في Auth وحفظ بياناته في Firestore
  window.createEmployeeAccount = async function() {
    const code = document.getElementById('empCode').value.trim();
    const name = document.getElementById('empName').value.trim();
    const job = document.getElementById('empJob').value.trim();
    const email = document.getElementById('empEmail').value.trim().toLowerCase();

    if (!code || !name || !job || !email) {
      return alert("يرجى ملء جميع البيانات: الكود، الاسم، الوظيفة، والبريد الإلكتروني.");
    }

    const generatedPassword = generateRandomPassword();

    try {
      // 1. إنشاء تطبيق ثانوي لمنع تسجيل خروج الأدمن الحالي عند إنشاء حساب جديد
      const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
      const secondaryAuth = getAuth(secondaryApp);

      // 2. إنشاء الحساب في Firebase Auth
      await createUserWithEmailAndPassword(secondaryAuth, email, generatedPassword);

      // 3. حفظ بيانات الموظف الثابتة في Firestore مستند employees
      await setDoc(doc(db, "employees", code), {
        employeeCode: code,
        name: name,
        jobTitle: job,
        userEmail: email
      });

      // إظهار النتيجة للأدمن لنسخ كلمة المرور
      document.getElementById('createdEmail').textContent = email;
      document.getElementById('createdPassword').textContent = generatedPassword;
      document.getElementById('credentialsResult').classList.remove('hidden');

      alert(`تم إنشاء حساب الموظف ${name} بنجاح!`);
      document.getElementById('employeeForm').reset();
      await loadEmployees();

    } catch (e) {
      console.error("خطأ إنشاء الحساب:", e);
      if (e.code === 'auth/email-already-in-use') {
        alert("هذا البريد الإلكتروني مستخدم بالفعل.");
      } else {
        alert("حدث خطأ أثناء إنشاء الحساب: " + e.message);
      }
    }
  };

  // نسخ كلمة المرور إلى الحافظة
  window.copyPassword = function() {
    const pwd = document.getElementById('createdPassword').textContent;
    navigator.clipboard.writeText(pwd).then(() => {
      alert("تم نسخ كلمة المرور إلى الحافظة!");
    }).catch(err => {
      alert("تعذر النسخ تلقائياً، يمكنك نسخها يدوياً: " + pwd);
    });
  };

  // 2. جلب بيانات الموظفين
  async function loadEmployees() {
    try {
      const querySnapshot = await getDocs(collection(db, "employees"));
      employeesMap = {};
      const filterSelect = document.getElementById('filterEmployee');
      filterSelect.innerHTML = '<option value="ALL">جميع الموظفين</option>';

      querySnapshot.forEach((documentSnap) => {
        const data = documentSnap.data();
        if (data.employeeCode) {
          employeesMap[data.employeeCode] = data;

          const opt = document.createElement('option');
          opt.value = data.employeeCode;
          opt.textContent = `${data.name} (${data.employeeCode}) - ${data.jobTitle || ''}`;
          filterSelect.appendChild(opt);
        }
      });
    } catch (e) {
      console.error("خطأ تحميل قائمة الموظفين:", e);
    }
  }

  // 3. تحميل جميع سجلات الحضور
  async function loadAllAttendance() {
    try {
      const querySnapshot = await getDocs(collection(db, "attendance"));
      allAttendanceLogs = [];

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        allAttendanceLogs.push(data);
      });

      allAttendanceLogs.sort((a, b) => {
        const timeA = a.timestamp && a.timestamp.seconds ? a.timestamp.seconds : 0;
        const timeB = b.timestamp && b.timestamp.seconds ? b.timestamp.seconds : 0;
        return timeB - timeA;
      });

      renderTable();
    } catch (e) {
      console.error("خطأ تحميل الحضور:", e);
    }
  }

  // 4. عرض جدول الحضور
  function renderTable() {
    const tbody = document.getElementById('attendanceTableBody');
    tbody.innerHTML = '';

    if (allAttendanceLogs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">لا توجد سجلات حضور.</td></tr>';
      return;
    }

    allAttendanceLogs.forEach(log => {
      const empCode = log.userId || '-';
      const empInfo = employeesMap[empCode] || {};
      
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${empCode}</strong></td>
        <td>${empInfo.name || '<span style="color:#888;">غير معروف</span>'}</td>
        <td>${empInfo.jobTitle || '-'}</td>
        <td>${log.date || '-'}</td>
        <td>🟢 ${log.checkIn || '-'}</td>
        <td>🔴 ${log.checkOut || '<span style="color:#dc3545;">لم يسجل</span>'}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 5. إعداد خيارات السنة والشهر
  function setupDateSelectors() {
    const yearSelect = document.getElementById('filterYear');
    const monthSelect = document.getElementById('filterMonth');
    const currentYear = new Date().getFullYear();

    yearSelect.innerHTML = '';
    for (let y = currentYear; y >= currentYear - 3; y--) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      yearSelect.appendChild(opt);
    }

    monthSelect.innerHTML = '';
    monthNames.forEach((m, index) => {
      const opt = document.createElement('option');
      opt.value = index + 1;
      opt.textContent = m;
      if (index === new Date().getMonth()) opt.selected = true;
      monthSelect.appendChild(opt);
    });
  }

  // 6. تصدير التقرير الشهري
  window.exportReport = function() {
    const selectedEmpCode = document.getElementById('filterEmployee').value;
    const selectedYear = parseInt(document.getElementById('filterYear').value);
    const selectedMonth = parseInt(document.getElementById('filterMonth').value);

    let filtered = allAttendanceLogs.filter(log => {
      const matchYear = log.year === selectedYear;
      const matchMonth = log.month === selectedMonth;
      const matchEmp = (selectedEmpCode === "ALL") || (log.userId === selectedEmpCode);
      return matchYear && matchMonth && matchEmp;
    });

    if (filtered.length === 0) {
      return alert("لا توجد سجلات مطابقة للفلتر المحدد.");
    }

    let csvContent = "\uFEFF"; 
    csvContent += "كود الموظف,اسم الموظف,الوظيفة,البريد الإلكتروني,التاريخ,وقت الحضور,وقت الانصراف\n";

    filtered.forEach(log => {
      const empCode = log.userId || '';
      const empInfo = employeesMap[empCode] || {};
      const empName = empInfo.name || '';
      const empJob = empInfo.jobTitle || '';
      const empEmail = empInfo.userEmail || '';
      const checkOutStr = log.checkOut ? log.checkOut : 'لم يسجل انصراف';

      csvContent += `"${empCode}","${empName}","${empJob}","${empEmail}","${log.date}","${log.checkIn}","${checkOutStr}"\n`;
    });

    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    
    const fileName = `تقرير_الموظفين_${selectedEmpCode}_${selectedMonth}_${selectedYear}.csv`;

    link.setAttribute("href", url);
    link.setAttribute("download", fileName);
    document.body.appendChild(link);
    
    link.click();
    document.body.removeChild(link);
  };

  window.logout = function() {
    signOut(auth);
  };
</script>

</body>
</html>
