<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الحضور والانصراف - تسجيل الدخول</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #f4f6f8; margin: 0; }
    .card { background: white; padding: 25px; border-radius: 12px; max-width: 450px; margin: 30px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2, h3 { color: #333; margin-top: 0; }
    label { font-size: 14px; color: #555; display: block; margin-top: 10px; }
    input, button { width: 100%; padding: 12px; margin-top: 6px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 15px; }
    button:hover { background: #0056b3; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #bd2130; }
    .btn-secondary { background: #6c757d; }
    .hidden { display: none; }
    ul { margin-top: 20px; padding: 0; list-style: none; }
    li { background: #f8f9fa; padding: 12px; margin-bottom: 8px; border-radius: 6px; border-right: 4px solid #007bff; font-size: 14px; }
    .user-info { background: #e9ecef; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

<div class="card">
  
  <!-- ================= 1. شاشة تسجيل الدخول بالبريد والكلمة السرية ================= -->
  <div id="authSection">
    <h2>تسجيل دخول الموظفين</h2>
    
    <label for="email">البريد الإلكتروني:</label>
    <input type="email" id="email" placeholder="example@company.com">
    
    <label for="password">كلمة المرور:</label>
    <input type="password" id="password" placeholder="••••••••">
    
    <button onclick="login()">دخول 🔓</button>
  </div>

  <!-- ================= 2. شاشة الحضور والانصراف ================= -->
  <div id="attendanceSection" class="hidden">
    <div class="user-info">
      <span>مرحباً: <strong id="userEmail"></strong></span>
      <button onclick="logout()" class="btn-secondary" style="width: auto; padding: 5px 10px; margin: 0; font-size: 12px;">خروج</button>
    </div>

    <h2>تسجيل الحضور والانصراف</h2>
    <input type="text" id="employeeName" placeholder="أدخل اسمك الثلاثي">
    <button onclick="clockIn()">تسجيل حضور 🟢</button>
    <button onclick="clockOut()" class="btn-danger">تسجيل انصراف 🔴</button>

    <h3>سجل الحضور الخاص بك:</h3>
    <ul id="logList">جاري تحميل البيانات...</ul>
  </div>

</div>

<!-- استدعاء خدمات Firebase (App, Auth, Firestore) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 🔴 ضع بيانات مشروعك الخاصة هنا
  const firebaseConfig = {
    apiKey: "AIzaSyABP_eeOuqYlpSd848PlpKvx71oFLsxREQ",

    authDomain: "hadir-c203e.firebaseapp.com",

    projectId: "hadir-c203e",

    storageBucket: "hadir-c203e.firebasestorage.app",

    messagingSenderId: "510890207479",

    appId: "1:510890207479:web:7f710f815631b4c8f80bf2"

  };

  // تهيئة الخدمات
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;

  // متابعة حالة تسجيل الدخول تلقائياً
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('attendanceSection').classList.remove('hidden');
      document.getElementById('userEmail').textContent = user.email;
      loadLogs();
    } else {
      currentUser = null;
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('attendanceSection').classList.add('hidden');
    }
  });

  // 1. دالة تسجيل الدخول
  window.login = async function() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) return alert('يرجى إدخال البريد الإلكتروني وكلمة المرور');

    try {
      await signInWithEmailAndPassword(auth, email, password);
      alert('تم تسجيل الدخول بنجاح!');
    } catch (error) {
      console.error("خطأ تسجيل الدخول:", error);
      alert('بيانات الدخول غير صحيحة أو الحساب غير موجود.');
    }
  };

  // 2. تسجيل الخروج
  window.logout = function() {
    signOut(auth);
  };

  // 3. تسجيل الحضور
  window.clockIn = async function() {
    const name = document.getElementById('employeeName').value.trim();
    if (!name) return alert('يرجى إدخال الاسم الثلاثي');

    try {
      const now = new Date();
      await addDoc(collection(db, "attendance"), {
        userId: currentUser.uid,
        userEmail: currentUser.email,
        name: name,
        date: now.toLocaleDateString('ar-EG'),
        checkIn: now.toLocaleTimeString('ar-EG'),
        checkOut: null,
        timestamp: now
      });

      alert(`تم تسجيل حضور ${name} بنجاح!`);
      loadLogs();
    } catch (e) {
      console.error("خطأ الحفظ:", e);
      alert("حدث خطأ أثناء تسجيل الحضور.");
    }
  };

  // 4. تسجيل الانصراف
  window.clockOut = async function() {
    try {
      const q = query(
        collection(db, "attendance"), 
        where("userId", "==", currentUser.uid), 
        where("checkOut", "==", null)
      );
      const querySnapshot = await getDocs(q);

      if (querySnapshot.empty) {
        return alert("لم يتم العثور على تسجيل حضور نشط لك!");
      }

      const now = new Date();
      const docToUpdate = querySnapshot.docs[0];
      await updateDoc(doc(db, "attendance", docToUpdate.id), {
        checkOut: now.toLocaleTimeString('ar-EG')
      });

      alert("تم تسجيل انصرافك بنجاح!");
      loadLogs();
    } catch (e) {
      console.error("خطأ التحديث:", e);
      alert("حدث خطأ أثناء تسجيل الانصراف.");
    }
  };

  // 5. عرض سجلات الموظف الحالي فقط
  async function loadLogs() {
    if (!currentUser) return;
    const list = document.getElementById('logList');
    list.innerHTML = 'جاري التحميل...';

    const q = query(collection(db, "attendance"), where("userId", "==", currentUser.uid));
    const querySnapshot = await getDocs(q);
    
    list.innerHTML = '';
    if (querySnapshot.empty) {
      list.innerHTML = '<li>لا توجد سجلات سابقة لك.</li>';
      return;
    }

    querySnapshot.forEach((doc) => {
      const data = doc.data();
      const li = document.createElement('li');
      li.textContent = `${data.name} | التاريخ: ${data.date} | حضور: ${data.checkIn} | انصراف: ${data.checkOut || 'لم يسجل بعد'}`;
      list.appendChild(li);
    });
  }
</script>

</body>
</html>
