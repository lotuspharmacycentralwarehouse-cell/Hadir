<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الحضور والانصراف - تسجيل الدخول</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #f4f6f8; margin: 0; }
    .card { background: white; padding: 25px; border-radius: 12px; max-width: 500px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2, h3 { color: #333; margin-top: 0; }
    label { font-size: 14px; color: #555; display: block; margin-top: 10px; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 15px; }
    button:hover { background: #0056b3; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #bd2130; }
    .btn-success { background: #28a745; }
    .btn-success:hover { background: #218838; }
    .btn-secondary { background: #6c757d; }
    .hidden { display: none; }
    ul { margin-top: 15px; padding: 0; list-style: none; }
    li { background: #f8f9fa; padding: 12px; margin-bottom: 8px; border-radius: 6px; border-right: 4px solid #007bff; font-size: 14px; }
    .user-info { background: #e9ecef; padding: 12px; border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .export-box { background: #f1f3f5; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6; margin-top: 25px; }
    .flex-row { display: flex; gap: 10px; }
    .flex-row > div { flex: 1; }
  </style>
</head>
<body>

<div class="card">
  
  <!-- ================= 1. شاشة تسجيل الدخول ================= -->
  <div id="authSection">
    <h2>تسجيل دخول الموظفين</h2>
    
    <label for="email">البريد الإلكتروني:</label>
    <input type="email" id="email" placeholder="example@company.com">
    
    <label for="password">كلمة المرور:</label>
    <input type="password" id="password" placeholder="••••••••">
    
    <button onclick="login()">دخول 🔓</button>
  </div>

  <!-- ================= 2. شاشة الحضور والانصراف والتصدير ================= -->
  <div id="attendanceSection" class="hidden">
    <div class="user-info">
      <div>
        <div style="font-size: 12px; color: #666;">الموظف الحالي:</div>
        <strong id="userDisplay" style="color: #007bff; font-size: 16px;"></strong>
      </div>
      <button onclick="logout()" class="btn-secondary" style="width: auto; padding: 6px 12px; margin: 0; font-size: 12px;">خروج</button>
    </div>

    <h2>تسجيل الحضور والانصراف</h2>
    
    <button onclick="clockIn()">تسجيل حضور 🟢</button>
    <button onclick="clockOut()" class="btn-danger">تسجيل انصراف 🔴</button>

    <!-- صندوق فلترة وتصدير التقرير الشهري -->
    <div class="export-box">
      <h3 style="font-size: 16px; margin-bottom: 10px;">📊 تصدير التقرير الشهري (Excel)</h3>
      <div class="flex-row">
        <div>
          <label for="yearSelect">السنة:</label>
          <select id="yearSelect" onchange="updateMonthSelector()">
            <!-- سيتم ملؤها ديناميكياً -->
          </select>
        </div>
        <div>
          <label for="monthSelect">الشهر:</label>
          <select id="monthSelect">
            <!-- سيتم ملؤها ديناميكياً بناءً على السنة المختارة -->
          </select>
        </div>
      </div>
      <button onclick="exportToExcel()" class="btn-success">تنزيل تقرير الشهر 📥</button>
    </div>

    <h3>سجل الحضور الشامل:</h3>
    <ul id="logList">جاري تحميل البيانات...</ul>
  </div>

</div>

<!-- استدعاء خدمات Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 🔴 ضع بيانات مشروعك الخاصة هنا
  const firebaseConfig = {
    apiKey: "AIzaSyABP_eeOuqYlpSd848PlpKvx71oFLsxREQ",

    authDomain: "hadir-c203e.firebaseapp.com",

    projectId: "hadir-c203e",

    storageBucket: "hadir-c203e.firebasestorage.app",

    messagingSenderId: "510890207479",

    appId: "1:510890207479:web:7f710f815631b4c8f80bf2"

  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let userLogs = [];

  // أسماء الشهور بالعربية للتحويل من الأرقام
  const monthNames = [
    "يناير (1)", "فبراير (2)", "مارس (3)", "أبريل (4)", 
    "مايو (5)", "يونيو (6)", "يوليو (7)", "أغسطس (8)", 
    "سبتمبر (9)", "أكتوبر (10)", "نوفمبر (11)", "ديسمبر (12)"
  ];

  // متابعة حالة تسجيل الدخول
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('attendanceSection').classList.remove('hidden');
      
      const displayName = user.displayName || user.email;
      document.getElementById('userDisplay').textContent = displayName;
      
      loadLogs();
    } else {
      currentUser = null;
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('attendanceSection').classList.add('hidden');
    }
  });

  // 1. تسجيل الدخول
  window.login = async function() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) return alert('يرجى إدخال البريد الإلكتروني وكلمة المرور');

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      console.error("خطأ تسجيل الدخول:", error);
      alert('بيانات الدخول غير صحيحة أو الحساب غير موجود.');
    }
  };

  // 2. تسجيل الخروج
  window.logout = function() {
    signOut(auth);
  };

  // 3. تسجيل الحضور
  window.clockIn = async function() {
    if (!currentUser) return;
    const employeeName = currentUser.displayName || currentUser.email.split('@')[0];

    try {
      const q = query(
        collection(db, "attendance"), 
        where("userId", "==", currentUser.uid), 
        where("checkOut", "==", null)
      );
      const activeSnapshot = await getDocs(q);

      if (!activeSnapshot.empty) {
        return alert("أنت مسجل حضور بالفعل! يجب تسجيل الانصراف أولاً.");
      }

      const now = new Date();
      await addDoc(collection(db, "attendance"), {
        userId: currentUser.uid,
        userEmail: currentUser.email,
        name: employeeName,
        date: now.toLocaleDateString('en-US'),
        year: now.getFullYear(),
        month: now.getMonth() + 1,
        day: now.getDate(),
        checkIn: now.toLocaleTimeString('ar-EG'),
        checkOut: null,
        timestamp: now
      });

      alert(`تم تسجيل حضورك بنجاح!`);
      loadLogs();
    } catch (e) {
      console.error("خطأ الحفظ:", e);
      alert("حدث خطأ أثناء تسجيل الحضور.");
    }
  };

  // 4. تسجيل الانصراف
  window.clockOut = async function() {
    if (!currentUser) return;

    try {
      const q = query(
        collection(db, "attendance"), 
        where("userId", "==", currentUser.uid), 
        where("checkOut", "==", null)
      );
      const querySnapshot = await getDocs(q);

      if (querySnapshot.empty) {
        return alert("لم يتم العثور على تسجيل حضور نشط لك!");
      }

      const now = new Date();
      const docToUpdate = querySnapshot.docs[0];
      await updateDoc(doc(db, "attendance", docToUpdate.id), {
        checkOut: now.toLocaleTimeString('ar-EG')
      });

      alert("تم تسجيل انصرافك بنجاح!");
      loadLogs();
    } catch (e) {
      console.error("خطأ التحديث:", e);
      alert("حدث خطأ أثناء تسجيل الانصراف.");
    }
  };

  // 5. تحميل السجلات وإعداد قائمة السنوات والشهور المسجلة ديناميكياً
  async function loadLogs() {
    if (!currentUser) return;
    const list = document.getElementById('logList');
    list.innerHTML = 'جاري التحميل...';

    try {
      const q = query(collection(db, "attendance"), where("userId", "==", currentUser.uid));
      const querySnapshot = await getDocs(q);
      
      userLogs = [];
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        let dateObj = data.timestamp ? data.timestamp.toDate() : new Date(data.date);
        data.year = data.year || dateObj.getFullYear();
        data.month = data.month || (dateObj.getMonth() + 1);

        userLogs.push(data);
      });

      userLogs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      renderLogList();
      populateYearSelector();

    } catch (e) {
      console.error("خطأ تحميل السجلات:", e);
      list.innerHTML = '<li>حدث خطأ أثناء تحميل السجلات.</li>';
    }
  }

  function renderLogList() {
    const list = document.getElementById('logList');
    list.innerHTML = '';

    if (userLogs.length === 0) {
      list.innerHTML = '<li>لا توجد سجلات سابقة لك.</li>';
      return;
    }

    userLogs.forEach((data) => {
      const li = document.createElement('li');
      const dateString = data.timestamp ? data.timestamp.toDate().toLocaleDateString('ar-EG') : data.date;
      li.textContent = `التاريخ: ${dateString} | حضور: ${data.checkIn} | انصراف: ${data.checkOut || 'لم يسجل بعد'}`;
      list.appendChild(li);
    });
  }

  // تعبئة قائمة السنوات المتاحة بالسيستم
  function populateYearSelector() {
    const yearSelect = document.getElementById('yearSelect');
    const currentYear = new Date().getFullYear();

    const availableYears = [...new Set(userLogs.map(log => log.year))];
    if (availableYears.length === 0) availableYears.push(currentYear);
    availableYears.sort((a, b) => b - a);

    yearSelect.innerHTML = '';
    availableYears.forEach(year => {
      const opt = document.createElement('option');
      opt.value = year;
      opt.textContent = year;
      if (year === currentYear) opt.selected = true;
      yearSelect.appendChild(opt);
    });

    // تحديث الشهور بناءً على السنة المختارة أول مرة
    updateMonthSelector();
  }

  // تعبئة الشهور المتاحة ديناميكياً للسنة المختارة فقط
  window.updateMonthSelector = function() {
    const yearSelect = document.getElementById('yearSelect');
    const monthSelect = document.getElementById('monthSelect');
    const selectedYear = parseInt(yearSelect.value);

    // استخراج الشهور المسجلة في السنة المختارة
    const logsInYear = userLogs.filter(log => log.year === selectedYear);
    const availableMonths = [...new Set(logsInYear.map(log => log.month))];
    availableMonths.sort((a, b) => a - b);

    monthSelect.innerHTML = '';

    if (availableMonths.length === 0) {
      const opt = document.createElement('option');
      opt.value = "";
      opt.textContent = "لا توجد شهور مسجلة";
      monthSelect.appendChild(opt);
      return;
    }

    availableMonths.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = monthNames[m - 1]; // استدعاء اسم الشهر
      monthSelect.appendChild(opt);
    });
  };

  // 6. تصدير التقرير
  window.exportToExcel = function() {
    const selectedMonth = parseInt(document.getElementById('monthSelect').value);
    const selectedYear = parseInt(document.getElementById('yearSelect').value);

    if (!selectedMonth) {
      return alert("يرجى اختيار شهر يحتوي على سجلات لتصديره.");
    }

    const filteredLogs = userLogs.filter(log => log.month === selectedMonth && log.year === selectedYear);

    if (filteredLogs.length === 0) {
      return alert(`لا توجد سجلات حضور مسجلة لشهر (${selectedMonth}) سنة (${selectedYear})`);
    }

    let csvContent = "\uFEFF"; 
    csvContent += "الاسم,البريد الإلكتروني,التاريخ,وقت الحضور,وقت الانصراف\n";

    filteredLogs.forEach(row => {
      const dateStr = row.timestamp ? row.timestamp.toDate().toLocaleDateString('ar-EG') : row.date;
      const checkOutStr = row.checkOut ? row.checkOut : 'لم يسجل انصراف';
      csvContent += `"${row.name}","${row.userEmail}","${dateStr}","${row.checkIn}","${checkOutStr}"\n`;
    });

    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    
    const employeeName = currentUser.displayName || currentUser.email.split('@')[0];
    const fileName = `تقرير_حضور_${employeeName}_${selectedMonth}_${selectedYear}.csv`;

    link.setAttribute("href", url);
    link.setAttribute("download", fileName);
    document.body.appendChild(link);
    
    link.click();
    document.body.removeChild(link);
  };
</script>

</body>
</html>
